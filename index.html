<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Stream Light</title>
    <link rel="stylesheet" href="panel.css">
    <!-- Fredoka 600 is the text overlay's face (js/overlay-text.js TEXT_FONT_FAMILY). media="print" keeps the
         stylesheet from blocking rendering; the overlay redraws once the face loads (js/app.js setup). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" media="print" onload="this.media='all'">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
        }
        body.hide-cursor { cursor: none; }
        #app {
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #app canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #camera-notice {
            position: fixed;
            left: 50%; bottom: 24px;
            transform: translateX(-50%);
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font: 16px 'Segoe UI', sans-serif;
            border-radius: 4px;
            z-index: 3000;
        }
        #camera-notice[hidden] { display: none; }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="camera-notice" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
